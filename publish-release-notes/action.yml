name: Publish release notes
description: >-
  Put the notes that release-notes uploaded (the `release-notes` artifact of
  this run) on the GitHub Release for a tag, creating the release if it does
  not exist. Run it in its own job with contents write, after the job that ran
  release-notes, and only when that action's `skip` output is not 'true'.

inputs:
  tag:
    description: The vX.Y.Z tag, the same one passed to release-notes.
    required: true
  github-token:
    description: Token that can create and edit releases (contents write).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-notes
        path: ${{ runner.temp }}/release-notes

    - name: Create or update the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        # release-notes checks for the same marker; keep the two in step.
        MARKER: '<!-- release-notes: claude -->'
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/release-notes/body.md"
        {
          echo "$MARKER"
          echo
          cat "$RUNNER_TEMP/release-notes/release-notes.md"
        } > "$notes"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --notes-file "$notes"
        else
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
        fi
        gh release view "$TAG" --json url --jq .url
