name: Release notes

# Writes the GitHub Release notes for a version tag (vX.Y.Z) with Claude Code.
#
# Runs when a version tag is pushed, or a release is published from the web UI,
# and can be started by hand for any existing tag to rewrite its notes. Floating
# tags such as v3 are ignored. The release is created if it does not exist yet.
#
# Claude writes the notes in a job whose GITHUB_TOKEN can only read, and may
# only use git/gh read commands and write the notes file (--allowedTools). A
# separate job with contents: write puts them on the release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to write the notes for, e.g. v3.1.0"
        required: true
        type: string

permissions:
  contents: read

# A tag push and a release published from the web UI can both fire for the same
# tag; they queue, and the second finds the notes already written.
concurrency:
  group: release-notes-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  # Put at the start of every body this workflow writes, so a second run for
  # the same tag can tell the notes are already there.
  MARKER: "<!-- release-notes: claude -->"

jobs:
  write:
    name: Write notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Claude Code authenticates through the Claude GitHub App
    outputs:
      skip: ${{ steps.range.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, to find the previous version
          persist-credentials: false

      - name: Find the previous version
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null || {
            echo "::error::tag $TAG does not exist"
            exit 1
          }
          # Only a run started by hand rewrites notes this workflow already wrote.
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          if [[ "$EVENT" != "workflow_dispatch" && "$body" == "$MARKER"* ]]; then
            echo "::notice::$TAG already has notes from this workflow; start it by hand to rewrite them"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest vX.Y.Z tag that is an ancestor of this one.
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude "$TAG" "$TAG^" 2>/dev/null || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Writing notes for $TAG since ${previous:-the first commit}"

      - name: Write the notes with Claude Code
        if: ${{ steps.range.outputs.skip != 'true' }}
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Write the GitHub Release notes for ${{ env.TAG }} of ${{ github.repository }}, and save them
            to `release-notes.md` in the repository root. Do not change any other file, and do not post
            anything to GitHub.

            This repository holds composite GitHub Actions (each `<name>/action.yml`) and reusable
            workflows (`.github/workflows/go-ci.yml`, `.github/workflows/go-release.yml`) that other
            cerebrai-app repositories pin by commit, with the tag as a comment. Its README explains each.
            Readers are maintainers of those repositories, deciding whether to bump their pin and what
            they must change when they do.

            The release covers ${{ steps.range.outputs.previous != '' && format('{0}..{1}', steps.range.outputs.previous, env.TAG) || format('everything up to {0}', env.TAG) }}.
            Read that history with `git log` and `git diff`, and the pull requests it merged with
            `gh pr view <number>` (their descriptions explain the why). Base every statement on what the
            diff shows; do not guess.

            Format, in Markdown, with no top-level heading (GitHub shows the tag as the title):
            - First, if anything requires callers to change (a removed or renamed input, a new required
              secret or permission, different behavior), a "Breaking changes" section listing each one
              and exactly what a caller must change, with a short before/after snippet where it helps.
              A major version bump with no such change is still worth one line saying why it is major.
            - Then "New" and "Fixes" sections, as needed. Each bullet names the action or workflow it
              touches in backticks and links its pull request as #<number>.
            - Leave out changes that only touch this repository's own CI, tests or docs, unless a
              caller would notice. If nothing is left in a section, leave the section out.
            - End with one line comparing the versions:
              `**Full changelog:** https://github.com/${{ github.repository }}/compare/<previous>...${{ env.TAG }}`
              (or nothing if there is no previous version).

            Keep it short and plain: a sentence per bullet, the reader's point of view, no marketing.
          claude_args: >-
            --allowedTools "Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git tag:*),Bash(gh pr view:*),Bash(gh pr list:*),Read,Glob,Grep,Write"

      - name: Check the notes were written
        if: ${{ steps.range.outputs.skip != 'true' }}
        run: |
          if [[ ! -s release-notes.md ]]; then
            echo "::error::Claude did not write release-notes.md"
            exit 1
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.range.outputs.skip != 'true' }}
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish notes
    needs: write
    if: ${{ needs.write.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, or edit its notes
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Create or update the release
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes/body.md"
          { echo "$MARKER"; echo; cat "$RUNNER_TEMP/notes/release-notes.md"; } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          fi
          gh release view "$TAG" --json url --jq .url
