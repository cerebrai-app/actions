name: Test Go actions

# Runs the Go composite actions from this commit against testdata/go-app, with
# the same jobs a calling repository has (see the README), so a change to them
# is exercised before callers pin it. The publish job only runs on tags, and
# this workflow never runs on tags, so nothing is released.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WORKDIR: testdata/go-app

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./go-lint
        with:
          working-directory: ${{ env.WORKDIR }}

  test:
    name: Test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: stable
            race: 'true'
          - go: go.mod
            race: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./go-test
        with:
          working-directory: ${{ env.WORKDIR }}
          go-version: ${{ matrix.go }}
          race: ${{ matrix.race }}
          main-packages: . ./cmd/go-tool
          smoke-test-args: ${{ matrix.go == 'stable' && 'version' || '' }}

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./go-cross-build
        with:
          working-directory: ${{ env.WORKDIR }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./govulncheck
        with:
          working-directory: ${{ env.WORKDIR }}

  build:
    name: Release build
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.build.outputs.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: build
        uses: ./go-release-build
        with:
          working-directory: ${{ env.WORKDIR }}

  # Never runs here (no tags), but keeps the publish job's shape checked by
  # actionlint and the inputs by the Lint workflow.
  publish:
    name: Release publish
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./go-release-publish
        with:
          working-directory: ${{ env.WORKDIR }}
          go-version: ${{ needs.build.outputs.go-version }}
