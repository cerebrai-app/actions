name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # renovate: datasource=pypi depName=check-jsonschema
  CHECK_JSONSCHEMA_VERSION: 0.39.0
  # renovate: datasource=pypi depName=shellcheck-py
  SHELLCHECK_PY_VERSION: 0.11.0.1
  # renovate: datasource=pypi depName=PyYAML
  PYYAML_VERSION: 6.0.3

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Self-hosted runners don't come with Go, which installs actionlint below.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      # Self-hosted runners don't come with Python, pipx or shellcheck. Install
      # Python, then the pinned tools: check-jsonschema, shellcheck (from
      # shellcheck-py, which actionlint also runs on the `run:` scripts) and
      # PyYAML for shellcheck-actions.py.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install the Python lint tools
        run: |
          python -m pip install --disable-pip-version-check \
            "check-jsonschema==$CHECK_JSONSCHEMA_VERSION" \
            "shellcheck-py==$SHELLCHECK_PY_VERSION" \
            "PyYAML==$PYYAML_VERSION"

      # Workflows, including the `run:` scripts (with the shellcheck installed
      # above) and the inputs passed to local actions such as ./renovate.
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint" -color

      # actionlint does not read action.yml files, so check their structure
      # against the published schema for action metadata.
      - name: Validate action.yml schema
        run: |
          check-jsonschema \
            --builtin-schema vendor.github-actions ./*/action.yml

      - name: shellcheck composite action scripts
        run: python .github/scripts/shellcheck-actions.py
