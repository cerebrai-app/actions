name: Go release

# Reusable release for Go programs built with GoReleaser. On a tag like v1.2.3
# it tests the tagged commit, builds every archive with GoReleaser on one
# ubuntu-latest runner, runs each linux/amd64 binary, and then publishes:
#
#   1. a build provenance attestation for every archive (verify one with
#      `gh attestation verify <file> --owner <owner>`);
#   2. the GitHub Release, with the archives and checksums.txt as tested;
#   3. optionally, the Homebrew casks and Scoop manifests from the caller's
#      .goreleaser.yaml, pushed to tap/bucket repositories with a GitHub App
#      token that can write to those repositories only, after checking that
#      GoReleaser's rebuild matches the released archives.
#
# Re-running a failed publish job is safe: an existing release is kept.
#
# Called from a pull request it builds a snapshot and publishes nothing, so a
# change is checked before a release. See the README for a full caller.
#
# The caller's .goreleaser.yaml must disable `release` and `changelog` (this
# workflow creates the release, so GoReleaser never gets a token that can write
# to the calling repository), set snapshot.version_template, and build
# reproducibly: step 3 rebuilds the archives, and the casks and manifests carry
# that rebuild's checksums, which must match the tested archives.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with the module's go.mod and .goreleaser.yaml, relative to the repository root.
        type: string
        default: .
      smoke-test-args:
        description: >-
          Arguments to run each linux/amd64 binary with before anything is
          published (the runner can only run those). The output must be
          exactly `<binary name> <version>`. Empty skips it.
        type: string
        default: version
      tap-repositories:
        description: >-
          Comma-separated repositories of the caller's owner that the
          Homebrew casks and Scoop manifests are pushed to, e.g.
          `homebrew-tap,scoop-bucket`. The GitHub App token is limited to
          these. Empty (or no app secrets) skips step 3.
        type: string
        default: ''
    secrets:
      tap-app-client-id:
        description: >-
          Client ID of a GitHub App installed on `tap-repositories` with
          read/write on Contents. Without it, releases are published without
          updating the casks and manifests.
        required: false
      tap-app-private-key:
        description: The app's private key, the whole .pem file.
        required: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.2

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.go.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser and the default-branch check need the history and tags
          persist-credentials: false

      # Require the tagged commit to be on the default branch, so a tag pushed
      # on a feature branch cannot publish unreviewed code. (A tag protection
      # rule for v* in the repository settings is the other half of this.)
      - name: Tagged commit must be on the default branch
        if: ${{ github.ref_type == 'tag' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH"
            exit 1
          fi

      # No cache: a poisoned cache entry would end up in a published binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # The publish job rebuilds with exactly this Go, so its archives match.
      - name: Record the Go version
        id: go
        run: echo "version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      # Gate: a tag on a commit whose tests fail must not build or publish anything.
      - run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          workdir: ${{ inputs.working-directory }}
          args: >-
            release --clean --skip=publish
            ${{ github.ref_type != 'tag' && '--snapshot' || '' }}

      # Run each binary that is about to be published, where the runner can:
      # it must start and report its own version, which also proves the
      # version made it into the binary.
      - name: Smoke test
        if: ${{ inputs.smoke-test-args != '' }}
        env:
          SMOKE_TEST_ARGS: ${{ inputs.smoke-test-args }}
        run: |
          set -euo pipefail
          read -ra args <<< "$SMOKE_TEST_ARGS"
          version=$(jq -r .version dist/metadata.json)
          binaries=$(jq -r '.[] | select(.type == "Binary" and .goos == "linux" and .goarch == "amd64")
            | "\(.extra.Binary)\t\(.path)"' dist/artifacts.json)
          if [[ -z "$binaries" ]]; then
            echo "::warning::no linux/amd64 binary, so nothing was smoke-tested"
            exit 0
          fi
          while IFS=$'\t' read -r bin path; do
            out=$("./$path" "${args[@]}")
            echo "$out"
            if [[ "$out" != "$bin $version" ]]; then
              echo "::error::expected \"$bin $version\" from $bin ${args[*]}, got \"$out\""
              exit 1
            fi
          done <<< "$binaries"

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          jq -r '.[] | select(.type == "Archive" or .type == "Checksum") | .path' dist/artifacts.json \
            | xargs -I{} cp {} "$RUNNER_TEMP/release/"
          ls -l "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAP_APP_CLIENT_ID: ${{ secrets.tap-app-client-id }}
      TAP_REPOSITORIES: ${{ inputs.tap-repositories }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/checksums.txt

      # Skipped when the release exists, so this job can be re-run after a
      # failure in step 3 (e.g. once the tap app secrets are fixed).
      - name: Create release
        run: |
          ls -l "$RUNNER_TEMP/release"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; not creating it again"
            exit 0
          fi
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"

      - name: Skip the casks and manifests without an app
        if: ${{ env.TAP_APP_CLIENT_ID == '' || env.TAP_REPOSITORIES == '' }}
        run: echo "::notice::No tap-app-client-id or tap-repositories, so no Homebrew casks or Scoop manifests were published."

      # Step 3: GoReleaser rebuilds and pushes the casks and manifests. Its
      # `release` section is disabled, and its only token is the app's, which
      # can write to the tap repositories and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.TAP_APP_CLIENT_ID != '' && env.TAP_REPOSITORIES != '' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ env.TAP_APP_CLIENT_ID != '' && env.TAP_REPOSITORIES != '' }}
        with:
          go-version: ${{ needs.build.outputs.go-version }}
          cache: false

      - name: Create tap token
        id: tap-token
        if: ${{ env.TAP_APP_CLIENT_ID != '' && env.TAP_REPOSITORIES != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.tap-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.tap-repositories }}
          permission-contents: write

      # The casks and manifests carry the checksums of GoReleaser's own build,
      # so rebuild first (publishing nothing) and require the archives to match
      # the released ones before anything is pushed to the tap repositories.
      # (GoReleaser's before_publish hook would do this in one run, but it is
      # a Pro feature.)
      - name: Rebuild without publishing
        if: ${{ steps.tap-token.outputs.token != '' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          workdir: ${{ inputs.working-directory }}
          args: release --clean --skip=publish

      - name: Rebuilt archives must match the release
        if: ${{ steps.tap-token.outputs.token != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          if ! diff -u "$RUNNER_TEMP/release/checksums.txt" dist/checksums.txt; then
            echo "::error::the rebuild for the casks and manifests differs from the released archives, so nothing was pushed to the tap repositories; check that .goreleaser.yaml builds reproducibly"
            exit 1
          fi

      - name: Publish casks and manifests
        if: ${{ steps.tap-token.outputs.token != '' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          workdir: ${{ inputs.working-directory }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

      # Same check on the build that was actually published.
      - name: Published checksums must match the release
        if: ${{ steps.tap-token.outputs.token != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          if ! diff -u "$RUNNER_TEMP/release/checksums.txt" dist/checksums.txt; then
            echo "::error::the casks and manifests just published carry checksums that differ from the released archives, so brew and scoop will refuse to install them; check that .goreleaser.yaml builds reproducibly"
            exit 1
          fi
