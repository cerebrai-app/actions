name: Go release

# Reusable release for Go programs built with GoReleaser. On a tag like v1.2.3
# it tests the tagged commit, builds every archive with GoReleaser on one
# ubuntu-latest runner, runs each linux/amd64 binary, and publishes the
# archives and checksums.txt as one GitHub Release. Called from a pull request
# it builds a snapshot and publishes nothing, so a change is checked before a
# release. See the README for a full caller:
#
#   jobs:
#     release:
#       uses: cerebrai-app/actions/.github/workflows/go-release.yml@<commit sha> # v2
#       permissions:
#         contents: write # the publish job creates the release
#
# What to build lives in the caller's .goreleaser.yaml (builds, archives,
# checksum). Its `release` and `changelog` sections must be disabled: the
# publish job creates the release itself, so GoReleaser never gets a token that
# can write. The version is GoReleaser's {{ .Version }}, the tag without its
# "v"; set snapshot.version_template for pull requests.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with the module's go.mod and .goreleaser.yaml, relative to the repository root.
        type: string
        default: .
      smoke-test-args:
        description: >-
          Arguments to run each linux/amd64 binary with before anything is
          published (the runner can only run those). The output must be
          exactly `<binary name> <version>`. Empty skips it.
        type: string
        default: version

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.2

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser and the default-branch check need the history and tags
          persist-credentials: false

      # Require the tagged commit to be on the default branch, so a tag pushed
      # on a feature branch cannot publish unreviewed code. (A tag protection
      # rule for v* in the repository settings is the other half of this.)
      - name: Tagged commit must be on the default branch
        if: ${{ github.ref_type == 'tag' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH"
            exit 1
          fi

      # No cache: a poisoned cache entry would end up in a published binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Gate: a tag on a commit whose tests fail must not build or publish anything.
      - run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          workdir: ${{ inputs.working-directory }}
          args: >-
            release --clean --skip=publish
            ${{ github.ref_type != 'tag' && '--snapshot' || '' }}

      # Run each binary that is about to be published, where the runner can:
      # it must start and report its own version, which also proves the
      # version made it into the binary.
      - name: Smoke test
        if: ${{ inputs.smoke-test-args != '' }}
        env:
          SMOKE_TEST_ARGS: ${{ inputs.smoke-test-args }}
        run: |
          set -euo pipefail
          read -ra args <<< "$SMOKE_TEST_ARGS"
          version=$(jq -r .version dist/metadata.json)
          binaries=$(jq -r '.[] | select(.type == "Binary" and .goos == "linux" and .goarch == "amd64")
            | "\(.extra.Binary)\t\(.path)"' dist/artifacts.json)
          if [[ -z "$binaries" ]]; then
            echo "::warning::no linux/amd64 binary, so nothing was smoke-tested"
            exit 0
          fi
          while IFS=$'\t' read -r bin path; do
            out=$("./$path" "${args[@]}")
            echo "$out"
            if [[ "$out" != "$bin $version" ]]; then
              echo "::error::expected \"$bin $version\" from $bin ${args[*]}, got \"$out\""
              exit 1
            fi
          done <<< "$binaries"

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          jq -r '.[] | select(.type == "Archive" or .type == "Checksum") | .path' dist/artifacts.json \
            | xargs -I{} cp {} "$RUNNER_TEMP/release/"
          ls -l "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create release
        run: |
          ls -l release
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
