name: Go release

# Reusable release for a Go program. On a tag like v1.2.3 it tests the tagged
# commit, builds a binary for each target, runs every binary once on a runner
# of its own platform, and publishes them as a GitHub Release. Called from a
# pull request it does everything except publish, so a change to the caller is
# checked before a release. See the README for a full caller:
#
#   jobs:
#     release:
#       uses: cerebrai-app/actions/.github/workflows/go-release.yml@<commit sha> # v1
#       permissions:
#         contents: write # the publish job creates the release
#       with:
#         binary-name: brainctl
#
# The version comes from the tag (v1.2.3 -> 1.2.3) and is linked into the binary
# with `-ldflags -X <version-variable>=<version>`. Outside a tag it is 0.0.0-dev.

on:
  workflow_call:
    inputs:
      binary-name:
        description: Name of the binary, and the first part of each archive name.
        type: string
        required: true
      working-directory:
        description: Directory with the module's go.mod, relative to the repository root.
        type: string
        default: .
      main-package:
        description: Package of the program's main, relative to `working-directory`.
        type: string
        default: .
      version-variable:
        description: >-
          Fully qualified string variable the version is linked into. The
          default is go-cerebrai's buildinfo package; a program with its own
          variable passes e.g. `main.version`.
        type: string
        default: github.com/cerebrai-app/go-cerebrai/buildinfo.version
      smoke-test-args:
        description: >-
          Arguments to run each built binary with before it is published. Its
          output must be exactly `<binary-name> <version>`. Empty skips it.
        type: string
        default: version
      extra-files:
        description: Space-separated files, relative to `working-directory`, to put next to the binary in each archive.
        type: string
        default: README.md LICENSE
      targets:
        description: >-
          JSON list of {goos, goarch, runner}. Every binary is cross-compiled
          with cgo off, and `runner` is where it is built and smoke-tested, so
          it must be able to run that binary (macOS arm64 runs amd64 binaries
          under Rosetta). `ubuntu-24.04-arm` is free for public repositories.
        type: string
        default: >-
          [
            {"goos": "linux", "goarch": "amd64", "runner": "ubuntu-latest"},
            {"goos": "linux", "goarch": "arm64", "runner": "ubuntu-24.04-arm"},
            {"goos": "darwin", "goarch": "arm64", "runner": "macos-latest"},
            {"goos": "darwin", "goarch": "amd64", "runner": "macos-latest"},
            {"goos": "windows", "goarch": "amd64", "runner": "windows-latest"}
          ]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # Gate: a tag on a commit whose tests fail must not build or publish anything.
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to tell whether a tag is on the default branch
          persist-credentials: false

      # Require the tagged commit to be on the default branch, so a tag pushed
      # on a feature branch cannot publish unreviewed code. (A tag protection
      # rule for v* in the repository settings is the other half of this.)
      - name: Tagged commit must be on the default branch
        if: ${{ github.ref_type == 'tag' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]"
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
          else
            version=0.0.0-dev
          fi
          echo "version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            ${{ inputs.working-directory }}/go.mod
            ${{ inputs.working-directory }}/go.sum

      - run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      BIN: ${{ inputs.binary-name }}
      VERSION: ${{ needs.test.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache here: a poisoned cache entry would end up in a published binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Build
        id: build
        env:
          MAIN_PACKAGE: ${{ inputs.main-package }}
          VERSION_VARIABLE: ${{ inputs.version-variable }}
        run: |
          name="$BIN-v$VERSION-$GOOS-$GOARCH"
          exe="$BIN"
          [[ "$GOOS" == windows ]] && exe="$BIN.exe"
          mkdir -p "stage/$name"
          go build -trimpath -ldflags "-s -w -X $VERSION_VARIABLE=$VERSION" \
            -o "stage/$name/$exe" "$MAIN_PACKAGE"
          {
            echo "name=$name"
            echo "exe=$exe"
          } >> "$GITHUB_OUTPUT"

      # Run the binary that is about to be published: it must start and report
      # its own version, which also proves the version made it into the binary.
      - name: Smoke test
        if: ${{ inputs.smoke-test-args != '' }}
        env:
          SMOKE_TEST_ARGS: ${{ inputs.smoke-test-args }}
          EXE: stage/${{ steps.build.outputs.name }}/${{ steps.build.outputs.exe }}
        run: |
          read -ra args <<< "$SMOKE_TEST_ARGS"
          out=$("./$EXE" "${args[@]}")
          echo "$out"
          if [[ "$out" != "$BIN $VERSION" ]]; then
            echo "::error::expected \"$BIN $VERSION\" from $BIN ${args[*]}, got \"$out\""
            exit 1
          fi

      - name: Package
        env:
          NAME: ${{ steps.build.outputs.name }}
          EXTRA_FILES: ${{ inputs.extra-files }}
        run: |
          read -ra extra <<< "$EXTRA_FILES"
          if (( ${#extra[@]} )); then
            cp "${extra[@]}" "stage/$NAME/"
          fi
          mkdir -p dist
          cd stage
          if [[ "$GOOS" == windows ]]; then
            file="$NAME.zip"
            7z a -tzip "../dist/$file" "$NAME"
          else
            file="$NAME.tar.gz"
            tar czf "../dist/$file" "$NAME"
          fi
          cd ../dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$file" > "$file.sha256"
          else
            shasum -a 256 "$file" > "$file.sha256"
          fi
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ inputs.working-directory }}/dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Create release
        run: |
          ls -l dist
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
