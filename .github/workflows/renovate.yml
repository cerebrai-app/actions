name: Renovate

# Self-hosted Renovate for this repository, using its own `renovate` action
# (see renovate/action.yml for the app secrets it needs). Runs weekly, and can be
# started by hand from the Actions tab with an optional dry run.

on:
  schedule:
    - cron: "41 17 * * 1" # Mondays, 12:41 EST / 13:41 EDT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log what would change without opening PRs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./renovate
        with:
          app-client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          dry-run: ${{ inputs.dry_run }}
