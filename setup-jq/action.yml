name: Set up jq
description: >-
  Install jq and put it on PATH, for self-hosted runners that don't come with
  it. The download is checked against the release's sha256sum.txt and kept in
  the runner's tool cache. Linux and macOS, x64 and arm64. The composite
  actions in this repository that call jq already run this themselves.

inputs:
  version:
    description: >-
      jq version to install, e.g. `1.8.2`. Empty installs the version pinned
      in install.sh, which Renovate keeps up to date.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install jq
      shell: bash
      env:
        JQ_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'
