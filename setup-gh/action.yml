name: Set up the GitHub CLI
description: >-
  Install the GitHub CLI (gh) and put it on PATH, for self-hosted runners that
  don't come with it. The download is checked against the release's
  checksums.txt and kept in the runner's tool cache. Linux and macOS, x64 and
  arm64. The composite actions in this repository that call gh already run
  this themselves.

inputs:
  version:
    description: >-
      gh version to install, e.g. `v2.104.0`. Empty installs the version pinned
      in install.sh, which Renovate keeps up to date.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install gh
      shell: bash
      env:
        GH_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'
