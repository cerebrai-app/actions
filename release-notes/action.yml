name: Release notes
description: >-
  Write the release notes for a version tag (vX.Y.Z) with Claude Code, from the
  commits and pull requests since the previous version tag, and upload them as
  the `release-notes` artifact for publish-release-notes. Check out the
  repository with full history first (`fetch-depth: 0`). Run it in a job with
  contents and pull-requests read and id-token write, and nothing more: Claude
  may only use git and gh read commands and write the notes file. Publish the
  notes from a separate job with publish-release-notes.

inputs:
  claude-code-oauth-token:
    description: Claude Code OAuth token (pass `secrets.CLAUDE_CODE_OAUTH_TOKEN`).
    required: true
  tag:
    description: >-
      The vX.Y.Z tag: the pushed tag, the published release's tag, or a
      workflow_dispatch input.
    required: true
  about:
    description: >-
      What the repository is and who reads its releases, in a sentence or two.
      It steers what the notes cover, e.g. "Composite actions that other
      repositories pin by commit; readers decide whether to bump the pin."
      Empty points Claude at the README.
    required: false
    default: ''
  rewrite:
    description: >-
      'true' rewrites notes this action already wrote for the tag (e.g. on a
      run started by hand). Otherwise such a release is skipped.
    required: false
    default: 'false'
  github-token:
    description: Token Claude reads pull requests with (read access is enough).
    required: false
    default: ${{ github.token }}

outputs:
  skip:
    description: "'true' when the release already has notes from this action and `rewrite` is not 'true'."
    value: ${{ steps.range.outputs.skip }}
  previous:
    description: The previous vX.Y.Z tag, or empty for the first version.
    value: ${{ steps.range.outputs.previous }}

runs:
  using: composite
  steps:
    - name: Find the previous version
      id: range
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
        REWRITE: ${{ inputs.rewrite }}
        # publish-release-notes writes the same marker; keep the two in step.
        MARKER: '<!-- release-notes: claude -->'
      run: |
        set -euo pipefail
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::$TAG is not a vX.Y.Z tag"
          exit 1
        fi
        if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
          echo "::error::tag $TAG does not exist (check out with fetch-depth: 0)"
          exit 1
        fi
        body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
        if [[ "$REWRITE" != "true" && "$body" == "$MARKER"* ]]; then
          echo "::notice::$TAG already has notes from this action; rewrite them with rewrite: 'true'"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The newest vX.Y.Z tag that is an ancestor of this one.
        previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude "$TAG" "$TAG^" 2>/dev/null || true)
        {
          echo "previous=$previous"
          echo "skip=false"
        } >> "$GITHUB_OUTPUT"
        echo "Writing notes for $TAG since ${previous:-the first commit}"

    - name: Write the notes with Claude Code
      if: ${{ steps.range.outputs.skip != 'true' }}
      uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        prompt: |
          Write the GitHub Release notes for ${{ inputs.tag }} of ${{ github.repository }}, and save them
          to `release-notes.md` in the repository root. Do not change any other file, and do not post
          anything to GitHub.

          About this repository: ${{ inputs.about != '' && inputs.about || 'read its README.' }}
          Write for the people who use its releases and decide whether to upgrade.

          The release covers ${{ steps.range.outputs.previous != '' && format('{0}..{1}', steps.range.outputs.previous, inputs.tag) || format('everything up to {0}', inputs.tag) }}.
          Read that history with `git log` and `git diff`, and the pull requests it merged with
          `gh pr view <number>` (their descriptions explain the why). Base every statement on what the
          diff shows; do not guess.

          Format, in Markdown, with no top-level heading (GitHub shows the tag as the title):
          - First, if anything requires users to change something when they upgrade (a removed or
            renamed input, option or command, a new required setting, different behavior), a
            "Breaking changes" section listing each one and exactly what to change, with a short
            before/after snippet where it helps. A major version bump with no such change is still
            worth one line saying why it is major.
          - Then "New" and "Fixes" sections, as needed. Each bullet names the part it touches (an
            action, workflow, command or package) in backticks and links its pull request as #<number>.
          - Leave out changes that only touch the repository's own CI, tests or docs, unless a user
            would notice. If nothing is left in a section, leave the section out.
          - End with one line comparing the versions:
            `**Full changelog:** https://github.com/${{ github.repository }}/compare/<previous>...${{ inputs.tag }}`
            (or nothing if there is no previous version).

          Keep it short and plain: a sentence per bullet, the reader's point of view, no marketing.
        claude_args: >-
          --allowedTools "Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git tag:*),Bash(gh pr view:*),Bash(gh pr list:*),Read,Glob,Grep,Write"

    - name: Check the notes were written
      if: ${{ steps.range.outputs.skip != 'true' }}
      shell: bash
      run: |
        if [[ ! -s release-notes.md ]]; then
          echo "::error::Claude did not write release-notes.md"
          exit 1
        fi
        cat release-notes.md

    - if: ${{ steps.range.outputs.skip != 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-notes
        path: release-notes.md
        if-no-files-found: error
