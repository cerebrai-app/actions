# GoReleaser config for the test app that test-go-workflows.yml releases with
# the shared go-release.yml. It mirrors what a real program repository uses.
version: 2

builds:
  - &build
    id: go-app
    main: .
    binary: go-app
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
  - <<: *build
    id: go-tool
    main: ./cmd/go-tool
    binary: go-tool

archives:
  - &archive
    id: go-app
    ids: [go-app]
    name_template: "{{ .Binary }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    wrap_in_directory: true
    files: [README.md]
  - <<: *archive
    id: go-tool
    ids: [go-tool]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: 0.0.0-dev

# The release itself is created by the workflow's publish job.
changelog:
  disable: true
release:
  disable: true
